name: CI

on:
  push:
    branches: [main, sit, prod]
  pull_request:
    branches: [main, sit, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retainly
          POSTGRES_PASSWORD: test
          POSTGRES_DB: retainly
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://retainly:test@localhost:5432/retainly?schema=public&options=-c%20timezone%3DUTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn verify
  build-push:
    needs: verify
    if: github.event_name == 'push' && github.ref_name == 'sit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.api.outputs.digest }}
      migrate: ${{ steps.migrate.outputs.digest }}
      web: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build và đẩy api
        id: api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.api
          target: runtime
          push: true
          provenance: false
          tags: ghcr.io/trinhquocthinh/retainly-api:${{ github.sha }}

      - name: Build và đẩy migrate
        id: migrate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.api
          target: migrate
          push: true
          provenance: false
          tags: ghcr.io/trinhquocthinh/retainly-migrate:${{ github.sha }}

      - name: Build và đẩy web
        id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.web
          target: runtime
          push: true
          provenance: false
          tags: ghcr.io/trinhquocthinh/retainly-web:${{ github.sha }}

      - name: Ghi digest ra tóm tắt job
        run: |
          {
            echo "## Artifact của \`${GITHUB_SHA}\`"
            echo
            echo '| Image | Digest |'
            echo '|---|---|'
            echo "| api | \`${{ steps.api.outputs.digest }}\` |"
            echo "| migrate | \`${{ steps.migrate.outputs.digest }}\` |"
            echo "| web | \`${{ steps.web.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
