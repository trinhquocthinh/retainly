name: CI

on:
  push:
    branches:
      - sit
      - prod
  pull_request:
    branches:
      - sit
      - prod

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retainly
          POSTGRES_PASSWORD: test
          POSTGRES_DB: retainly
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://retainly:test@localhost:5432/retainly?schema=public&options=-c%20timezone%3DUTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn verify

  dispatch-sit:
    name: Dispatch verified SIT SHA
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/sit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Mint short-lived deploy dispatcher token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.HOMELAB_DEPLOY_APP_ID }}
          private-key: ${{ secrets.HOMELAB_DEPLOY_APP_PRIVATE_KEY }}
          owner: trinhquocthinh
          repositories: homelab-deploy

      - name: Dispatch exact verified SHA to private control plane
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid GITHUB_SHA"
            exit 1
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            repos/trinhquocthinh/homelab-deploy/actions/workflows/retainly-sit.yml/dispatches \
            -f ref=main \
            -f "inputs[source_sha]=$SOURCE_SHA"

          {
            echo "## Private deployment control-plane dispatch"
            echo
            echo "- Source SHA: `$SOURCE_SHA`"
            echo "- Target: `trinhquocthinh/homelab-deploy/.github/workflows/retainly-sit.yml`"
            echo "- Authentication: short-lived GitHub App installation token"
          } >> "$GITHUB_STEP_SUMMARY"
