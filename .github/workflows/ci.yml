name: CI

on:
  push:
    branches: [main, sit, prod]
  pull_request:
    branches: [main, sit, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retainly
          POSTGRES_PASSWORD: test
          POSTGRES_DB: retainly
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://retainly:test@localhost:5432/retainly?schema=public&options=-c%20timezone%3DUTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn verify
