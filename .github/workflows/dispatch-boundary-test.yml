name: Dispatcher Boundary Test

on:
  push:
    branches:
      - infra/actions-private-boundary

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.HOMELAB_DEPLOY_APP_ID }}
          private-key: ${{ secrets.HOMELAB_DEPLOY_APP_PRIVATE_KEY }}
          owner: trinhquocthinh
          repositories: homelab-deploy

      - name: Dispatch current commit SHA
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            repos/trinhquocthinh/homelab-deploy/actions/workflows/retainly-sit.yml/dispatches \
            -f ref=main \
            -f "inputs[source_sha]=$SOURCE_SHA"
