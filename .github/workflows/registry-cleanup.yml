name: Registry cleanup

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

env:
  OWNER: trinhquocthinh
  KEEP: '20'
  # Đổi thành 'false' sau khi một lần chạy cho ra danh sách đúng.
  DRY_RUN: 'false'

jobs:
  digest-dang-chay:
    runs-on: [self-hosted, retainly-deploy]
    outputs:
      inuse: ${{ steps.doc.outputs.inuse }}
    steps:
      - name: Đọc digest của mọi container Retainly trên máy
        id: doc
        run: |
          all=''
          for c in retainly-sit-api retainly-sit-web retainly-sit-migrate \
                   retainly-prod-api retainly-prod-web retainly-prod-migrate; do
            d=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$c" 2>/dev/null || true)
            all="$all$d"
          done
          list=$(printf '%s\n' "$all" | sed -n 's/.*@\(sha256:[0-9a-f]\{64\}\)$/\1/p' | sort -u | paste -sd, -)
          echo "inuse=$list" >> "$GITHUB_OUTPUT"
          echo "Đang chạy trên máy này: ${list:-<chưa có container nào chạy bằng image từ registry>}"

  don-registry:
    needs: digest-dang-chay
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Chọn version quá hạn
        env:
          GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          INUSE: ${{ needs.digest-dang-chay.outputs.inuse }}
          DRY_RUN: ${{ env.DRY_RUN }}
          KEEP: ${{ env.KEEP }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::thiếu secret GHCR_CLEANUP_TOKEN"
            exit 1
          fi
          tong=0
          for pkg in retainly-api retainly-migrate retainly-web; do
            echo "::group::$pkg"
            if ! rows=$(gh api --paginate "/user/packages/container/$pkg/versions" \
                          --jq '.[] | [.created_at, .id, .name, (.metadata.container.tags | join(","))] | @tsv'); then
              echo "::error::không đọc được version của $pkg — kiểm scope của GHCR_CLEANUP_TOKEN"
              exit 1
            fi
            rows=$(printf '%s\n' "$rows" | sort -r)
            if [ -z "$rows" ]; then
              echo "package chưa có version nào"
              echo "::endgroup::"
              continue
            fi
            i=0
            while IFS=$'\t' read -r created id name tags; do
              [ -z "${id:-}" ] && continue
              i=$((i + 1))
              if [ "$i" -le "$KEEP" ]; then
                echo "giữ   #$i  $created  $name  [$tags]"
                continue
              fi
              case ",$INUSE," in
                *",$name,"*) echo "GIỮ   đang chạy  $name  [$tags]"; continue ;;
              esac
              tong=$((tong + 1))
              if [ "$DRY_RUN" = 'true' ]; then
                echo "SẼ XOÁ        $created  $name  [$tags]"
                tong=$((tong + 1))
              elif gh api -X DELETE "/user/packages/container/$pkg/versions/$id" >/dev/null; then
                echo "đã xoá        $created  $name  [$tags]"
                tong=$((tong + 1))
              else
                echo "::error::xoá thất bại $pkg $name — kiểm scope delete:packages"
                exit 1
              fi
            done <<< "$rows"
            echo "::endgroup::"
          done
          echo "Tổng thuộc diện xoá: $tong (DRY_RUN=$DRY_RUN)"
