<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:0 0 auto; background:#FFFFFF; border-bottom:1px solid #E5E7EB; font-family:Inter, system-ui, sans-serif; color:#1A1D23;">
  <div style="height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; font-size:12px; font-weight:600;"><span>9:41</span><span style="color:#636A78; letter-spacing:.1em;">▮▮▮</span></div>
  <div style="height:56px; display:flex; align-items:center; gap:4px; padding:0 8px;">
    <div style="position:relative; width:44px; height:44px; flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;">
      <span style="width:18px; height:2px; border-radius:1px; background:#1A1D23;"></span>
      <span style="width:18px; height:2px; border-radius:1px; background:#1A1D23;"></span>
      <span style="width:18px; height:2px; border-radius:1px; background:#1A1D23;"></span>
      <sc-if value="{{ dot }}" hint-placeholder-val="{{ false }}"><span style="position:absolute; top:10px; right:8px; width:8px; height:8px; border-radius:4px; background:#F59E0B; border:2px solid #FFFFFF;"></span></sc-if>
    </div>
    <div style="flex:1; min-width:0; font-size:18px; line-height:26px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ title }}</div>
    <div style="width:44px; height:44px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;"><span style="width:32px; height:32px; border-radius:16px; background:#FEF3C7; color:#92400E; font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center;">MA</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:101},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nguồn&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dot&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { title: this.props.title ?? 'Retainly', dot: this.props.dot === true || this.props.dot === 'true' };
  }
}
</script>
</body>
</html>
