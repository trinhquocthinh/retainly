name: retainly

services:
  db:
    image: postgres:16-alpine
    container_name: retainly-${STACK}-db
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - retainly_db:/var/lib/postgresql/data
    networks: [internal]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    image: ${MIGRATE_IMAGE:?MIGRATE_IMAGE chua duoc dat}
    container_name: retainly-${STACK}-migrate
    environment:
      TZ: Asia/Ho_Chi_Minh
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@retainly-${STACK}-db:5432/${DB_NAME}?schema=public&options=-c%20timezone%3DUTC
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: 'no'
    security_opt:
      - no-new-privileges:true
  api:
    image: ${API_IMAGE:?API_IMAGE chua duoc dat}
    container_name: retainly-${STACK}-api
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@retainly-${STACK}-db:5432/${DB_NAME}?schema=public&options=-c%20timezone%3DUTC
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [edge, internal]
    security_opt:
      - no-new-privileges:true

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE chua duoc dat}
    container_name: retainly-${STACK}-web
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    networks: [edge]
    security_opt:
      - no-new-privileges:true

networks:
  edge:
    name: edge
    external: true
  internal:
    internal: true

volumes:
  retainly_db:
